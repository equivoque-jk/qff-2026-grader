[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qff-local-grader"
version = "2.0.1"
description = "Offline automatic grader for the QFF 2026 Q-LINK challenge"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["qiskit==2.3.1", "numpy==2.2.6", "psutil==7.2.2"]

[project.optional-dependencies]
notebook = ["qiskit-aer==0.17.2", "matplotlib==3.10.8", "pylatexenc==2.10", "ipython>=7.34", "nbformat>=5"]
dev = ["build>=1.2"]

[project.scripts]
qff-grade = "qff_grader.cli:main"
qff-grade-batch = "qff_grader.batch:main"

[tool.setuptools]
packages = ["qff_grader"]

[tool.setuptools.package-data]
qff_grader = ["*.json"]
